<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart Monitor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bar">
  <div class="group" id="symbols"></div>
  <div class="group"><select id="layout"></select></div>
  <div class="group"><select id="style">
    <option value="candles">แท่งเทียน</option>
    <option value="ha">Heikin Ashi</option>
  </select></div>
  <div class="group">
    <label><input type="checkbox" id="stoch"> Stoch</label>
    <label><input type="checkbox" id="rsi"> RSI</label>
  </div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">ยังไม่เชื่อมต่อ</span></div>
  <button id="openSettings" title="ตั้งค่าการเชื่อมต่อ MT5">⚙ ตั้งค่า</button>
</div>
<div id="grid"></div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>เชื่อมต่อ MT5</h2>
    <p class="hint">ราคามาจาก MetaTrader 5 ในเครื่องนี้ ผ่านโปรแกรม bridge (start-bridge.bat)
      ไม่ต้องใส่รหัสผ่านหรือ token เพราะใช้บัญชีที่ล็อกอินใน MT5 อยู่แล้ว</p>
    <label class="field">ที่อยู่ bridge
      <input type="text" id="bridgeUrl" autocomplete="off" spellcheck="false">
    </label>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" id="cancelSettings">ยกเลิก</button>
      <button type="submit" class="on">บันทึกและเชื่อมต่อ</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="indicators.js"></script>
<script src="mt5.js"></script>
<script src="app.js"></script>
</body>
</html>
